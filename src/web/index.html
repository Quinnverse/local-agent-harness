<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Local Agent Harness</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <a class="skip-link" href="#workspace">跳转到工作区</a>
    <header class="site-header">
      <div class="brand-block">
        <p class="eyebrow">本地插件工作台</p>
        <h1>Local Agent Harness</h1>
      </div>
      <p class="loopback-note" id="connection-note">仅监听 <code>127.0.0.1</code></p>
    </header>

    <main class="app-shell" id="workspace">
      <aside class="sidebar" aria-labelledby="plugins-heading">
        <section class="install-panel" aria-labelledby="install-heading">
          <div class="section-heading compact-heading">
            <p class="eyebrow">独立能力 · 本地安装</p>
            <h2 id="install-heading">安装插件</h2>
          </div>
          <form id="install-form" novalidate>
            <label for="plugin-source">本地插件目录</label>
            <input id="plugin-source" name="source" type="text" required autocomplete="off" spellcheck="false" placeholder="/path/to/plugin">
            <p class="field-hint">复制已构建插件包，不自动安装依赖。</p>
            <button class="button primary" type="submit">安装本地插件</button>
          </form>
        </section>

        <div class="sidebar-heading">
          <div>
            <p class="eyebrow">能力库</p>
            <h2 id="plugins-heading">已安装插件</h2>
          </div>
          <button class="button text-button" id="refresh-plugins" type="button" aria-label="刷新插件列表">刷新</button>
        </div>
        <nav id="plugin-list" class="plugin-list" aria-label="已安装插件">
          <p class="empty-list">连接本地服务后查看插件。</p>
        </nav>
      </aside>

      <section class="content-area" aria-labelledby="workspace-heading">
        <div class="safety-notice" role="note" aria-labelledby="safety-heading">
          <div class="notice-mark" aria-hidden="true">i</div>
          <div>
            <h2 id="safety-heading">可信插件 · 明确边界</h2>
            <p>插件以普通子进程运行，并非操作系统沙箱。请只启用可信插件；目录授权仅约束宿主文件读取。本版本未接入 LLM。</p>
          </div>
        </div>

        <p id="status-message" class="status-message" role="status" aria-live="polite" aria-atomic="true">正在连接本地宿主…</p>
        <section id="detail-panel" class="detail-panel" aria-labelledby="workspace-heading">
          <div class="empty-workspace">
            <p class="eyebrow">本地工作区</p>
            <h2 id="workspace-heading">选择一个插件</h2>
            <p>先安装本地插件，再从左侧选择。查看协议和权限，保存配置，启用并运行声明的能力。</p>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
